<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Generator</title>
    <style>
        body {
            background: linear-gradient(to top, #081F4D, #0A3D91); /* Gece mavi tonları */
            color: #fff;
            font-family: 'Helvetica', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 60px;
            margin-bottom: 10px;
            font-size: 1.1em;
            padding: 10px;
            border: 2px solid #fff;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        button {
            font-size: 1em;
            padding: 12px 20px;
            border-radius: 5px;
            background-color: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }

        button:hover {
            background-color: #357ABD;
        }

        .story {
            margin-top: 20px;
            font-size: 1.2em;
        }

        .controls {
            margin-top: 20px;
        }

        /* Yıldız ve bulut animasyonu */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/dark-mesh.png'), 
                        radial-gradient(circle at bottom, #fff, transparent 70%);
            background-repeat: repeat;
            z-index: 1;
            animation: twinkling 2s infinite ease-in-out;
        }

        @keyframes twinkling {
            0% {opacity: 0.5;}
            50% {opacity: 1;}
            100% {opacity: 0.5;}
        }

        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/MxGuQNE.png') repeat-x; /* Bulut resmi */
            z-index: 1;
            animation: moveClouds 60s linear infinite;
        }

        @keyframes moveClouds {
            0% {background-position: 0 0;}
            100% {background-position: 1000px 0;}
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="clouds"></div>

    <div class="container">
        <h1>Story Generator</h1>
        <textarea id="inputWords" placeholder="Enter some words..."></textarea><br>
        <button id="generateButton">Generate Story</button>

        <div class="controls">
            <button id="playButton">Play Story</button>
            <button id="pauseButton">Pause</button>
            <button id="resetButton">Reset</button>
        </div>

        <div id="story" class="story"></div>
    </div>

    <script>
        let speech = new SpeechSynthesisUtterance();
        let isPaused = false;

        document.getElementById('generateButton').addEventListener('click', async () => {
            const inputWords = document.getElementById('inputWords').value.split(' ');
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input: inputWords })
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('story').innerText = data.story;
                speech.text = data.story; // Hikaye seslendirme için ayarlanıyor
                speech.lang = 'en-GB'; // İngiliz aksanı
            } else {
                const error = await response.json();
                document.getElementById('story').innerText = `Error generating story: ${error.error}`;
            }
        });

        document.getElementById('playButton').addEventListener('click', () => {
            if (isPaused) {
                speechSynthesis.resume();
                isPaused = false;
            } else {
                speechSynthesis.speak(speech);
            }
        });

        document.getElementById('pauseButton').addEventListener('click', () => {
            speechSynthesis.pause();
            isPaused = true;
        });

        document.getElementById('resetButton').addEventListener('click', () => {
            speechSynthesis.cancel(); // Seslendirmeyi durdur
            document.getElementById('story').innerText = ''; // Hikayeyi temizle
        });
    </script>
</body>
</html>
